listen = "0.0.0.0:8080"
public_url = "http://localhost:8080"
data_dir = "/var/lib/myrss"

[auth]
mode = "local"
session_idle_hours = 12

[auth.local]
password_file = "/run/myrss-secrets/myrss_owner_password"

